{% extends "base.html" %}
{% from "partials/icons.html" import icon %}
{% block title %}Not found | {{ app_name }}{% endblock %}
{% block content %}

  <h1 style="font-size:40px;color:var(--red)">404</h1>

</div>
{% endblock %}
